<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ebf4;--panel:#fff;--text:#142033;--muted:#5c6a82;--line:#c8d1e0;--accent:#e8394d;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1726;--panel:#18233a;--text:#eef2fa;--muted:#93a1bd;--line:#2a3856}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 17px/1.35 "Barlow Condensed",system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:8px;padding:6px 10px;width:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 20px;background:var(--panel);border-bottom:2px solid var(--line)}
h1{margin:0;font-size:28px;font-weight:800}
h2{font-size:22px;font-weight:800;margin:0 0 6px}
nav{display:flex;gap:6px}
nav button{border:2px solid var(--line);background:none;border-radius:8px;padding:5px 14px;font-weight:600}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.r{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#dirty{color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:800;white-space:nowrap}
.btn.alt{background:none;border:2px solid var(--line);color:var(--text)}
main{max-width:1000px;margin:0 auto;padding:20px}
[hidden]{display:none!important}
.note{color:var(--muted);margin:0 0 12px}
.two{display:grid;grid-template-columns:270px 1fr;gap:22px}
aside{display:flex;flex-direction:column;gap:8px}
#list{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
.row{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.row.on{border-color:var(--accent);background:var(--panel)}
.row b{min-width:28px;font-weight:800}.row span{flex:1}.row i{font-style:normal;color:var(--muted);font-size:14px}
.edit{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:start}
.form{display:flex;flex-direction:column;gap:10px;max-width:420px}
label{display:flex;flex-direction:column;gap:3px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sl{display:grid;grid-template-columns:78px 1fr 70px;align-items:center;gap:10px}
.sl input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
.id{color:var(--muted);font-size:15px}
.pv{position:sticky;top:12px;text-align:center}
.pv .big{font-size:22px;margin-top:12px}.pv .big b{font-size:44px;font-weight:800}
.tr{display:grid;grid-template-columns:1fr 180px 80px 90px;gap:10px;align-items:center;margin-bottom:8px}
.tr span{color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:2px 6px 2px 12px;margin:0 6px 6px 0}
.chip button{border:0;background:none;color:var(--muted);padding:0 4px}
.add{display:flex;gap:8px;margin-top:6px;max-width:340px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;z-index:9}
/* card look: same as the game */
.card{--cw:120px;width:var(--cw);height:calc(var(--cw)*1.45);font-size:calc(var(--cw)/10);border-radius:calc(var(--cw)/9);padding:.7em;display:flex;flex-direction:column;color:#1a1a1a;border:2px solid rgba(0,0,0,.25);overflow:hidden;line-height:1.1;text-align:left}
.pv .card{--cw:210px}
.card.bronze{background:linear-gradient(160deg,#c58a5a,#8a5a34)}
.card.silver{background:linear-gradient(160deg,#e3e7ec,#8f98a3)}
.card.gold{background:linear-gradient(160deg,#fbe38a,#b8860b)}
.card.legend{background:linear-gradient(160deg,#5b2d9e,#c23b7a 60%,#ff9a5a);color:#fff;box-shadow:0 0 16px #ff9a5a99}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.ovr{font-size:2.6em;font-weight:800;line-height:.9}.ico{font-size:2.2em;line-height:1}
.nm{font-weight:800;font-size:1.25em;margin-top:.3em}
.sub{opacity:.75;font-size:.9em;margin-bottom:.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:grid;grid-template-columns:1fr 1fr;gap:.1em .6em;font-weight:600;font-size:.95em}.st b{margin-left:.35em;font-weight:800}
.hp{margin-top:auto;font-weight:800;font-size:1.05em}
.tags{display:flex;gap:.3em;margin-top:.3em}
.tags i{font-style:normal;background:rgba(0,0,0,.22);color:#fff;border-radius:99px;padding:.1em .6em;font-size:.85em}
@media (max-width:760px){.two,.edit,.cols{grid-template-columns:1fr}.tr{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>🛠️ Card Maker</h1>
  <nav><button data-v="cards" class="on">Cards</button><button data-v="shows">Shows</button><button data-v="cats">Categories</button></nav>
  <div class="r"><span id="dirty"></span><button class="btn alt" id="imp">Import cards.json</button><button class="btn" id="exp">Export cards.json</button><input type="file" id="file" accept=".json,application/json" hidden></div>
</header>
<main>
  <section id="v-cards"><div class="two">
    <aside><input id="q" placeholder="Search cards"><button class="btn" id="new">+ New card</button><div id="list"></div></aside>
    <div id="ed"></div>
  </div></section>
  <section id="v-shows" hidden></section>
  <section id="v-cats" hidden></section>
</main>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const tier=o=>o>=86?"legend":o>=75?"gold":o>=55?"silver":"bronze"; // keep in sync with the game
const slug=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"item";
const uid=()=>Math.random().toString(36).slice(2,9);
const STAT=[["spd","Speed"],["str","Strength"],["ski","Skill"],["log","Logic"]];
let D={genres:["Sci-Fi","Comedy","Superhero","Fantasy","Crime","Action","Horror","Animation"],vibes:["Hero","Villain","Neutral","Broken","Evil","Stupid"],shows:[],cards:[]},sel=null,dirty=false;
try{const s=localStorage.getItem("fcm");if(s){D=JSON.parse(s);D.cards.forEach(c=>c.key=c.key||uid())}dirty=localStorage.getItem("fcm_dirty")==="1"}catch(e){}
function setDirty(b){dirty=b;try{localStorage.setItem("fcm_dirty",b?"1":"0")}catch(e){}$("#dirty").textContent=dirty?"● Not exported yet":"✓ Matches last export"}
function persist(){try{localStorage.setItem("fcm",JSON.stringify(D))}catch(e){}setDirty(true)}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
const cur=()=>D.cards.find(c=>c.key===sel),showOf=id=>D.shows.find(s=>s.id===id);
const ovr=c=>Math.round((c.spd+c.str+c.ski+c.log)/4);
function view(c){const s=showOf(c.show)||{name:"No show",genre:"–"},o=ovr(c);return{...c,show:s.name,genre:s.genre,ovr:o,r:tier(o)}}
const cardHTML=c=>`<div class="card ${c.r}"><div class="top"><span class="ovr">${c.ovr}</span><span class="ico">${esc(c.ico)}</span></div><div class="nm">${esc(c.name)||"Unnamed"}</div><div class="sub">${esc(c.show)}</div><div class="st"><span>SPD<b>${c.spd}</b></span><span>STR<b>${c.str}</b></span><span>SKL<b>${c.ski}</b></span><span>LOG<b>${c.log}</b></span></div><div class="hp">❤ ${c.hp}</div><div class="tags"><i>${esc(c.genre)}</i><i>${esc(c.vibe)}</i></div></div>`;

// ---- Cards ----
function renderList(){
  const q=$("#q").value.toLowerCase(),cs=D.cards.filter(c=>c.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  $("#list").innerHTML=cs.map(c=>`<div class="row ${c.key===sel?"on":""}" data-k="${c.key}"><b>${ovr(c)}</b><span>${esc(c.name)||"Unnamed"}</span><i>${esc((showOf(c.show)||{}).name||"")}</i></div>`).join("")||`<p class="note">No cards yet. Make your first one.</p>`;
}
const sl=(c,k,n,lo,hi)=>`<label class="sl">${n}<input type="range" data-f="${k}" min="${lo}" max="${hi}" value="${c[k]}"><input type="number" data-f="${k}" min="${lo}" max="${hi}" value="${c[k]}"></label>`;
function renderEd(){
  const c=cur();
  if(!c){$("#ed").innerHTML=`<p class="note">Pick a card on the left or make a new one.</p>`;return}
  const o=(arr,v,isShow)=>arr.map(x=>{const val=isShow?x.id:x;return`<option value="${esc(val)}" ${val===v?"selected":""}>${esc(isShow?x.name:x)}</option>`}).join("");
  $("#ed").innerHTML=`<div class="edit"><div class="form">
    <label>Name<input data-f="name" value="${esc(c.name)}"></label>
    <div class="g2"><label>Icon (emoji)<input data-f="ico" value="${esc(c.ico)}" maxlength="4"></label><label>Personality<select data-f="vibe">${o(D.vibes,c.vibe)}</select></label></div>
    <label>Show or film<select data-f="show"><option value="">Choose a show…</option>${o(D.shows,c.show,1)}</select></label>
    ${D.shows.length?"":`<div class="note">Add a show in the Shows tab first.</div>`}
    ${STAT.map(([k,n])=>sl(c,k,n,1,99)).join("")}${sl(c,"hp","Health",1,1000)}
    <div class="id">ID: ${c.id?esc(c.id)+" (locked)":"set from the name on first export"}</div>
    <div><button class="btn alt" id="dup">Duplicate</button> <button class="btn alt" id="del">Delete</button></div>
  </div><div class="pv"><div id="pv"></div><div class="big" id="ovr"></div></div></div>`;
  paint();
}
function paint(){const c=cur();if(!c)return;const v=view(c);$("#pv").innerHTML=cardHTML(v);$("#ovr").innerHTML=`Overall <b>${v.ovr}</b><br>${v.r[0].toUpperCase()+v.r.slice(1)} card`;renderList()}
$("#ed").addEventListener("input",e=>{
  const t=e.target,f=t.dataset.f,c=cur();if(!f||!c)return;
  let v=t.value;
  if(t.type==="range"||t.type==="number"){v=Math.max(1,Math.min(f==="hp"?1000:99,Math.round(+v)||1));$$(`#ed [data-f="${f}"]`).forEach(x=>{if(x!==t)x.value=v})}
  c[f]=v;persist();paint();
});
$("#ed").addEventListener("change",e=>{const t=e.target;if(t.type==="number"&&cur())t.value=cur()[t.dataset.f]});
$("#ed").addEventListener("click",e=>{
  const c=cur();if(!c)return;
  if(e.target.id==="dup"){const n={...c,key:uid(),id:"",name:c.name+" copy"};D.cards.push(n);sel=n.key;persist();renderEd()}
  if(e.target.id==="del"&&confirm(`Delete ${c.name||"this card"}?`)){D.cards=D.cards.filter(x=>x!==c);sel=null;persist();renderEd()}
});
$("#new").onclick=()=>{const c={key:uid(),id:"",name:"New fighter",show:(D.shows[0]||{}).id||"",vibe:D.vibes[0]||"",spd:50,str:50,ski:50,log:50,hp:500,ico:"❔"};D.cards.push(c);sel=c.key;persist();renderEd();$("#ed [data-f=name]").select()};
$("#list").onclick=e=>{const r=e.target.closest("[data-k]");if(r){sel=r.dataset.k;renderEd()}};
$("#q").oninput=renderList;

// ---- Shows ----
const genreOpts=v=>D.genres.map(g=>`<option ${g===v?"selected":""}>${esc(g)}</option>`).join("");
function renderShows(){
  $("#v-shows").innerHTML=`<h2>Shows and films</h2><p class="note">Each show has one genre. Fighters from the same show share the show point, and the genre point comes from the show’s genre.</p>
  ${D.shows.map(s=>`<div class="tr" data-s="${s.id}"><input data-sf="name" value="${esc(s.name)}"><select data-sf="genre">${genreOpts(s.genre)}</select><span>${D.cards.filter(c=>c.show===s.id).length} cards</span><button class="btn alt" data-delshow="${s.id}">Delete</button></div>`).join("")}
  <div class="tr"><input id="ns" placeholder="New show or film"><select id="ng">${genreOpts()}</select><span></span><button class="btn" id="adds">Add show</button></div>`;
}
$("#v-shows").addEventListener("input",e=>{const r=e.target.closest("[data-s]"),f=e.target.dataset.sf;if(r&&f){showOf(r.dataset.s)[f]=e.target.value;persist()}});
$("#v-shows").addEventListener("click",e=>{
  const d=e.target.dataset.delshow;
  if(d){const n=D.cards.filter(c=>c.show===d).length;if(n)return toast(`${n} card(s) still use this show`);D.shows=D.shows.filter(s=>s.id!==d);persist();renderShows()}
  if(e.target.id==="adds"){
    const name=$("#ns").value.trim(),genre=$("#ng").value;
    if(!name)return toast("Type a show name first");
    if(!genre)return toast("Add a genre in Categories first");
    if(D.shows.some(s=>s.name.toLowerCase()===name.toLowerCase()))return toast("That show already exists");
    let id=slug(name),b=id,n=2;while(showOf(id))id=b+"-"+n++;
    D.shows.push({id,name,genre});persist();renderShows();renderEd();
  }
});

// ---- Categories ----
function renderCats(){
  const col=(k,t)=>`<div><h2>${t}</h2>${D[k].map(x=>`<span class="chip">${esc(x)}<button data-rm="${k}" data-v="${esc(x)}" aria-label="Remove">✕</button></span>`).join("")}<div class="add"><input id="a-${k}" placeholder="Add one"><button class="btn" data-add="${k}">Add</button></div></div>`;
  $("#v-cats").innerHTML=`<p class="note">Personalities and genres you can pick from. One that’s in use can’t be removed.</p><div class="cols">${col("vibes","Personalities")}${col("genres","Genres")}</div>`;
}
$("#v-cats").addEventListener("click",e=>{
  const rm=e.target.dataset.rm,ad=e.target.dataset.add;
  if(rm){const v=e.target.dataset.v,used=rm==="genres"?D.shows.some(s=>s.genre===v):D.cards.some(c=>c.vibe===v);if(used)return toast(`“${v}” is in use`);D[rm]=D[rm].filter(x=>x!==v);persist();renderCats();renderEd()}
  if(ad){const v=$("#a-"+ad).value.trim();if(!v)return;if(D[ad].some(x=>x.toLowerCase()===v.toLowerCase()))return toast("Already in the list");D[ad].push(v);persist();renderCats();renderEd()}
});

// ---- Export / import ----
function validate(){
  const e=[],seen=new Set();
  D.cards.forEach(c=>{const n=c.name.trim();
    if(!n)e.push("A card has no name");else if(seen.has(n.toLowerCase()))e.push(`Two cards are named “${n}”`);
    seen.add(n.toLowerCase());
    if(!c.show)e.push(`${n||"A card"} needs a show`);
    if(!c.vibe)e.push(`${n||"A card"} needs a personality`)});
  D.shows.forEach(s=>{if(!s.name.trim())e.push("A show has no name")});
  return e;
}
$("#exp").onclick=()=>{
  const e=validate();if(e.length)return toast(e[0]+(e.length>1?` (+${e.length-1} more)`:""));
  const used=new Set(D.cards.map(c=>c.id).filter(Boolean));
  D.cards.forEach(c=>{if(!c.id){const b=slug(c.name);let i=b,n=2;while(used.has(i))i=b+"-"+n++;c.id=i;used.add(i)}}); // ids lock on first export
  const L=JSON.stringify,cards=D.cards.map(c=>({id:c.id,name:c.name.trim(),show:c.show,vibe:c.vibe,spd:c.spd,str:c.str,ski:c.ski,log:c.log,hp:c.hp,ico:c.ico}));
  const txt=`{\n"version":1,\n"genres":${L(D.genres)},\n"vibes":${L(D.vibes)},\n"shows":[\n${D.shows.map(s=>L({id:s.id,name:s.name.trim(),genre:s.genre})).join(",\n")}\n],\n"cards":[\n${cards.map(c=>L(c)).join(",\n")}\n]\n}\n`;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download="cards.json";a.click();
  try{localStorage.setItem("fcm",JSON.stringify(D))}catch(x){}setDirty(false);renderEd();toast(`Exported ${cards.length} cards`);
};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.shows)||!Array.isArray(d.cards))throw 0;
    if(D.cards.length&&!confirm("Replace everything in the maker with this file?"))return;
    const cl=(v,m)=>Math.max(1,Math.min(m,Math.round(+v)||1));
    D={genres:d.genres||[...new Set(d.shows.map(s=>s.genre))],vibes:d.vibes||[...new Set(d.cards.map(c=>c.vibe))],shows:d.shows,
       cards:d.cards.map(c=>({key:uid(),id:c.id||"",name:c.name,show:c.show,vibe:c.vibe,spd:cl(c.spd,99),str:cl(c.str,99),ski:cl(c.ski,99),log:cl(c.log,99),hp:cl(c.hp,1000),ico:c.ico||"❔"}))};
    sel=null;persist();setDirty(false);renderAll();toast(`Loaded ${D.cards.length} cards`);
  }catch(x){toast("That doesn’t look like a cards.json file")}
};

// ---- Tabs ----
$$("nav button").forEach(b=>b.onclick=()=>{$$("nav button").forEach(x=>x.classList.toggle("on",x===b));["cards","shows","cats"].forEach(v=>$("#v-"+v).hidden=v!==b.dataset.v)});
function renderAll(){renderList();renderEd();renderShows();renderCats();setDirty(dirty)}
renderAll();
</script>
</body>
</html>
