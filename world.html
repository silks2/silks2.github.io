<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worldwide Tycoon 3D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@3.2.0/dist/pmtiles.js"></script>
<style>
:root{--card:#fff;--line:#c5d1db;--ink:#1c2833;--mut:#6a7782;--bg:#f3f6f9;--acc:#e8590c;--ok:#2b8a3e;--bad:#c92a2a}
@media(prefers-color-scheme:dark){:root{--card:#16212b;--line:#2b3a48;--ink:#e8eef3;--mut:#8d9aa7;--bg:#0c131a;--ok:#51cf66;--bad:#ff6b6b}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
#ttl{color:var(--acc);font-size:16px}
.st i{display:block;font-style:normal;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.st span{font-weight:700}
.bad{color:var(--bad)}.ok{color:var(--ok)}.mut{color:var(--mut)}
#spd button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 9px;cursor:pointer;font:inherit}
#spd button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#main{position:relative;flex:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0}
#panel{position:absolute;top:8px;right:8px;bottom:28px;width:320px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 20px #0003;z-index:2}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 2px;color:var(--mut);font:inherit;font-weight:600;cursor:pointer}
.tabs .on{color:var(--acc);box-shadow:inset 0 -2px var(--acc)}
.pb{padding:12px;overflow:auto;flex:1}
h3{margin:0 0 2px;font-size:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:10px 0}.kv span{color:var(--mut)}
.b{display:block;width:100%;margin:6px 0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:center}
.b.p,#go{background:var(--acc);border-color:var(--acc);color:#fff}
.b:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 10px;cursor:pointer;font:inherit}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0}
input{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.li{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:8px 0;font:inherit;text-align:left;cursor:pointer}
.me{color:var(--acc);font-weight:700}
.note{background:var(--bg);padding:8px;border-radius:8px}
#news{position:absolute;left:10px;bottom:34px;max-width:calc(100% - 360px);display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:2}
.n{background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:12px}
#zh{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--acc);color:#fff;padding:6px 12px;border-radius:99px;font-weight:600;z-index:2;display:none}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;z-index:9;padding:16px}
.box{background:var(--card);padding:24px;border-radius:14px;max-width:380px;width:100%}
.box h2{margin:0 0 8px;color:var(--acc)}.box input{width:100%;box-sizing:border-box;margin:10px 0}
#go{width:100%;padding:11px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
@media(max-width:700px){#panel{top:auto;left:8px;right:8px;width:auto;height:44%}#news{bottom:46%;max-width:calc(100% - 20px)}}
</style></head><body>
<div id="app">
<div id="top"><b id="ttl">Worldwide Tycoon 3D</b>
<div class="st"><i>Player</i><span id="nm">â</span></div>
<div class="st"><i>Cash</i><span id="cash">â</span></div>
<div class="st"><i>Net worth</i><span id="nw">â</span></div>
<div class="st"><i>Day</i><span id="day">â</span></div>
<div class="st"><i>Business</i><span id="ico">â</span></div>
<div class="st"><i>Crops</i><span id="icr">â</span></div>
<div class="st"><i>Property</i><span id="ipr">â</span></div>
<input id="q" placeholder="Fly to any placeâ¦" style="width:150px">
<div id="spd"><button data-s="0">ââ</button><button data-s="1" class="on">1Ã</button><button data-s="3">3Ã</button></div></div>
<div id="main"><div id="map"></div><div id="zh">Zoom in to see buildings</div><div id="news"></div><div id="panel"></div></div></div>
<div id="gate"><div class="box"></div></div>
<script>
const $=s=>document.querySelector(s),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const f=n=>(n<0?'-':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');
const fm=n=>{const a=Math.abs(n),s=n<0?'-':'';return a>=1e6?s+'$'+(a/1e6).toFixed(2)+'M':a>=1e4?s+'$'+(a/1e3).toFixed(1)+'k':f(n)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// deterministic hashing: every real building gets the same price and owner for everyone
function H(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}h^=h>>>13;h=Math.imul(h,0x5bd1e995);h^=h>>>15;return(h>>>0)/4294967296}
const sm=t=>t*t*(3-2*t);
function vn(x,y){const i=Math.floor(x),j=Math.floor(y),u=sm(x-i),v=sm(y-j),g=(a,b)=>H(a+','+b);return(g(i,j)*(1-u)+g(i+1,j)*u)*(1-v)+(g(i,j+1)*(1-u)+g(i+1,j+1)*u)*v}
const nf=(lo,la)=>.6+1.4*(.65*vn(lo*80,la*80)+.35*vn(lo*8,la*8));
const TY={home:{i:.0026,u:.0009},company:{i:.0052,u:.0034},farm:{i:0,u:.001}};
const PL=[["London",-.1276,51.5072],["New York",-73.9857,40.7484],["Paris",2.2945,48.8584],["Tokyo",139.7671,35.6812],["Dubai",55.2744,25.1972],["Sydney",151.2093,-33.8688],["Rome",12.4964,41.9028],["Singapore",103.8198,1.2966]];
const BN=["Meridian Capital","Okafor Holdings","Sakura Estates","Atlas & Sons","Vega Ventures","Nordlicht GmbH","Solaris Group","Dragonfly Inc"];
let G=null,saved=null,run=false,sp=1,tab=0,sel=null,note='',lastH='',MP=null;
try{saved=JSON.parse(localStorage.getItem('wt3'))}catch(e){}
const save=()=>{try{localStorage.setItem('wt3',JSON.stringify({...G,props:Object.fromEntries(Object.entries(G.props).filter(([k,p])=>p.owner!==null))}))}catch(e){}};
const say=m=>{G.log.unshift({t:Date.now(),m});G.log.length=Math.min(G.log.length,30)};
function newG(name){return{name,day:1,cash:25000,loan:0,props:{},bots:BN.map(n=>({n,cash:2e4+Math.random()*1e5})),idx:{co:1,crop:1,prop:1},shock:0,log:[]}}
// ---- real map data -> properties
const ring=g=>g.type=='Polygon'?g.coordinates[0]:g.coordinates[0][0];
const cen=r=>{let x=0,y=0;r.forEach(p=>{x+=p[0];y+=p[1]});return[x/r.length,y/r.length]};
const areaM=r=>{const k=Math.cos(r[0][1]*Math.PI/180)*111320,m=110540;let s=0;for(let i=0;i<r.length-1;i++)s+=r[i][0]*k*r[i+1][1]*m-r[i+1][0]*k*r[i][1]*m;return Math.abs(s/2)};
const keyOf=f=>{const i=f.properties.id;if(i)return 'g'+i;const[lo,la]=cen(ring(f.geometry));return 'b'+Math.round(lo*1e5)+','+Math.round(la*1e5)};
const botFor=(k,t)=>null; // rivals switched off
function tn(ty,g){return ty=='home'?(g<100?'Small home':g<350?'House':'Large home'):ty=='company'?(g<1500?'Shop or office':g<1e4?'Office block':'Tower'):'Farmland'}
function mkB(f){const r=ring(f.geometry),key=keyOf(f);if(G.props[key])return G.props[key];
const[lo,la]=cen(r),pr=f.properties,area=areaM(r),h=+pr.height||(+pr.num_floors*3)||+pr.render_height||6,gfa=area*Math.max(1,Math.round(h/3)),q=H(key+'t');
const cls=((pr.class||'')+' '+(pr.subtype||'')).toLowerCase(),ty=/resid|house|apart|detached|terrace|bungalow|dormitory|cabin/.test(cls)?'home':/commerc|retail|office|industr|warehouse|hotel|supermarket|factory|service|civic|medical|education|transport/.test(cls)?'company':area<120&&h<10?'home':gfa>1500||h>20?'company':q<.6?'home':'company';
return G.props[key]={key,ty,tn:tn(ty,gfa),gfa:Math.round(gfa),base:Math.round(cl(gfa*250*nf(lo,la),5e3,5e7)/100)*100,lon:lo,lat:la,ci:Math.floor(lo*20)+','+Math.floor(la*20),nm:(ty=='home'?'House':'Building')+' ('+Math.round(gfa)+' mÂ²)',geo:{type:'Polygon',coordinates:[r.map(c=>[+c[0].toFixed(6),+c[1].toFixed(6)])]},h,b:+pr.min_height||+pr.render_min_height||0,owner:botFor(key,.2),cond:100,lvl:1,crop:null,rr:H(key+'r'),inq:false}}
function mkF(pt){const dx=.0012,dy=.0008,i=Math.floor(pt.lng/dx),j=Math.floor(pt.lat/dy),key='f'+i+','+j;if(G.props[key])return G.props[key];
const lo=i*dx,la=j*dy,cx=lo+dx/2,cy=la+dy/2;
return G.props[key]={key,ty:'farm',tn:'Farmland plot (0.7 ha)',base:Math.round(9000*nf(cx,cy)*(.8+.4*H(key))/100)*100,lon:cx,lat:cy,ci:Math.floor(cx*20)+','+Math.floor(cy*20),nm:'Farmland plot',geo:{type:'Polygon',coordinates:[[[lo,la],[lo+dx,la],[lo+dx,la+dy],[lo,la+dy],[lo,la]]]},h:.6,b:0,owner:botFor(key,.15),cond:100,lvl:1,crop:null,rr:H(key+'r'),inq:false}}
// ---- economy
const mine=()=>Object.values(G.props).filter(p=>p.owner==='me');
const value=p=>p.base*G.idx.prop*(.85+.15*p.cond/100)*(1+.25*(p.lvl-1));
const assets=()=>mine().reduce((s,p)=>s+value(p),0);
const nw=()=>G.cash+assets()-G.loan;
const syn=()=>1+.03*Math.min(30,mine().length-1);
const upk=p=>p.base*TY[p.ty].u*(1+.1*(p.lvl-1));
function inc(p){const T=TY[p.ty];if(!T.i)return 0;const m=p.ty=='company'?G.idx.co*(G.shock>0?.6:1):1;
return p.base*T.i*m*Math.pow(1.3,p.lvl-1)*(.4+.6*p.cond/100)*syn()*(mine().filter(q=>q.ci==p.ci).length>=3?1.1:1)}
const hv=p=>p.base*.11*G.idx.crop*Math.pow(1.3,p.lvl-1)*(.4+.6*p.cond/100)*syn();
const rsv=p=>value(p)*(1.05+p.rr*.45),ask=p=>Math.round(rsv(p)*1.12/100)*100;
const maxLoan=()=>Math.max(0,.4*assets()-G.loan);
function evt(){const q=Math.random();
if(q<.3){G.shock=20;say('Recession! Company income -40% for 20 days.')}
else if(q<.55){G.idx.prop*=1.08;say('Housing boom: property values +8%.')}
else if(q<.8){let n=0;const d=Math.random()<.5;mine().forEach(p=>{if(p.ty=='farm'&&p.crop!=null&&Math.random()<.6){p.crop=null;n++}});say('Drought: '+(n?'you lost '+n+' crop(s).':'your crops survived.'))}
else{G.idx.crop*=.7;say('Bumper harvest worldwide: crop prices fall 30%.')}}
function botsTick(){return;G.bots.forEach((b,i)=>{b.cash+=Object.values(G.props).filter(p=>p.owner===i).reduce((s,p)=>s+value(p)*.0018,0);
if(MP&&MP.getZoom()>=15&&Math.random()<.05){const fs=MP.queryRenderedFeatures({layers:['b3d']});for(let t=0;t<5&&fs.length;t++){const p=mkB(fs[Math.floor(Math.random()*fs.length)]);if(p.owner===null&&value(p)*1.05<b.cash){p.owner=i;b.cash-=value(p)*1.05;if(Math.random()<.5)say(b.n+' bought '+p.nm+' near you.');break}}}})}
function tick(){const g=G,I=g.idx,r=Math.random;g.day++;
I.co=cl(I.co+(1-I.co)*.06+(r()-.5)*.1,.45,1.6);I.crop=cl(I.crop+(1-I.crop)*.08+(r()-.5)*.16,.4,1.9);I.prop=cl(I.prop*(1+(r()-.47)*.006),.8,1.6);
if(g.shock>0)g.shock--;
const my=mine();let net=0;
my.forEach(p=>{net+=inc(p)-upk(p);p.cond=Math.max(5,p.cond-(p.ty=='farm'?.3:.7));if(p.crop!=null&&g.day-p.crop>16){p.crop=null;say('A crop rotted at '+p.nm+'. Harvest within 6 days of ripening!')}});
g.cash+=net;if(g.auto&&g.auto.on)my.forEach(p=>{if(p.cond<g.auto.pct){const c=p.base*.001*(100-p.cond);if(g.cash>=c){g.cash-=c;p.cond=100}}});if(g.loan)g.cash-=g.loan*.0012;if(g.cash<0)g.cash+=g.cash*.005;
if(g.day%30==0){const t=assets()*.012;if(t){g.cash-=t;say('Property tax paid: '+f(t))}}
if(r()<.04)evt();botsTick();ov();
if(g.cash<-(5000+.05*assets())){run=false;try{localStorage.removeItem('wt3')}catch(e){}saved=null;showGate(1);return}
if(g.day%5==0)save()}
// ---- panel
const btn=(a,t,d,p)=>`<button class="b${p?' p':''}" data-a="${a}" ${d?'disabled':''}>${t}</button>`;
function propH(){const p=sel?G.props[sel]:null,g=G;
if(!p)return `<p class="mut">Zoom into any city and tap a building (or a farm field) to inspect it. Every real building on Earth is a property. <b class="me">Orange</b> = yours.</p><p class="mut">Start with something small and cheap, watch the indices above, and build your empire.</p><div class="chips">`+PL.map((c,i)=>`<button data-a="fly" data-i="${i}">${c[0]}</button>`).join('')+'</div>';
const T=TY[p.ty],v=value(p),own=p.owner==='me',bot=typeof p.owner=='number';
let h=`<h3>${esc(p.nm)}</h3><div class="mut">${esc(p.tn)} Â· ${esc(p.loc||p.lat.toFixed(3)+', '+p.lon.toFixed(3))}</div><div class="kv"><span>Value</span><b>${f(v)}</b><span>Condition</span><b>${Math.round(p.cond)}%</b><span>Level</span><b>${p.lvl}/3</b><span>Owner</span><b>${own?'You':bot?esc(g.bots[p.owner].n):'For sale'}</b>`;
if(own){const i=inc(p),u=upk(p);h+=p.ty=='farm'?`<span>Upkeep</span><b>${f(u)}/day</b>`:`<span>Income</span><b>${f(i)}/day</b><span>Upkeep</span><b>${f(u)}/day</b><span>Net</span><b class="${i-u<0?'bad':'ok'}">${f(i-u)}/day</b>`}
else h+=p.ty=='farm'?`<span>Harvest (est.)</span><b>${f(p.base*.11*g.idx.crop)}</b><span>Seed cost</span><b>${f(p.base*.06)}</b><span>Upkeep</span><b>${f(upk(p))}/day</b>`:`<span>Income (est.)</span><b>${f(p.base*T.i*(p.ty=='company'?g.idx.co:1))}/day</b><span>Upkeep</span><b>${f(upk(p))}/day</b>`;
h+='</div>';
if(p.owner===null){const c=v*1.05;h+=btn('buy','Buy for '+f(c),g.cash<c,1)}
else if(own){const rc=p.base*.001*(100-p.cond),uc=p.base*.3*p.lvl;
if(p.cond<99)h+=btn('rep','Repair '+f(rc),g.cash<rc);
if(p.lvl<3)h+=btn('up','Upgrade '+f(uc)+' (+30% output)',g.cash<uc);
if(p.ty=='farm'){if(p.crop==null){const c=p.base*.06;h+=btn('pl','Plant crop '+f(c),g.cash<c,1)}else{const a=g.day-p.crop;h+=a>=10?btn('hv','Harvest â'+f(hv(p))+' (rots in '+(16-a)+'d)',0,1):`<p class="mut">Growingâ¦ ripe in ${10-a} days</p>`}}
h+=btn('sell','Sell to market for '+f(v*.85))}
else if(!p.inq)h+=btn('inq','Inquire about buying',0,1);
else{const a=ask(p);h+=`<p>${esc(g.bots[p.owner].n)} says: asking <b>${f(a)}</b>. They might take lessâ¦</p>`+btn('ba','Pay asking '+f(a),g.cash<a,1)+`<div class="row"><input id="oin" type="number" step="100" value="${Math.round(a*.9/100)*100}"><button class="b" style="width:auto" data-a="of">Make offer</button></div>`}
return h+(note?`<p class="note">${note}</p>`:'')}
function portH(){const my=mine();if(!my.length)return '<p class="mut">You donât own anything yet. Buy your first property to get started.</p>';
let t=0;const rows=my.map(p=>{const n=inc(p)-upk(p);t+=n;const rdy=p.ty=='farm'&&p.crop!=null&&G.day-p.crop>=10;return `<button class="li" data-a="sel" data-i="${p.key}"><span>${esc(p.nm)}<br><small class="mut">${esc(p.tn)} Â· ${Math.round(p.cond)}%${rdy?' Â· ripe!':''}</small></span><b class="${n<0?'bad':'ok'}">${f(n)}/d</b></button>`}).join('');
return `<div class="kv"><span>Net per day</span><b class="${t<0?'bad':'ok'}">${f(t)}</b><span>Properties</span><b>${my.length}</b><span>Empire bonus</span><b>+${Math.round((syn()-1)*100)}% income</b></div>`+btn('rall','Repair all')+btn('hall','Harvest all ripe')+arH()+rows}
function arH(){const a=G.auto;return `<div class="note" style="margin:8px 0"><b>Auto-repair</b><br><span class="mut">Fully repairs any property whose condition drops below the percentage you set, if you can afford it.</span><div class="row" style="margin-top:6px"><input id="arp" type="number" min="1" max="99" value="${a.pct}"><button class="b" style="width:auto;margin:0" data-a="arp">Set %</button></div>`+btn('ar','Auto-repair: '+(a.on?'ON':'OFF')+' (below '+a.pct+'%)',0,a.on)+'</div>'}
function rankH(){const w=i=>Object.values(G.props).filter(p=>p.owner===i);
const rows=[{n:G.name,w:nw(),c:mine().length,me:1},...G.bots.map((b,i)=>({n:b.n,w:b.cash+w(i).reduce((s,p)=>s+value(p),0),c:w(i).length}))].sort((a,b)=>b.w-a.w);
return '<p class="mut">Rivalsâ properties are counted around the places you have explored.</p>'+rows.map((r,i)=>`<div class="li" style="cursor:default"><span class="${r.me?'me':''}">${i+1}. ${esc(r.n)}<br><small class="mut">${r.c} properties</small></span><b>${fm(r.w)}</b></div>`).join('')}
function bankH(){const g=G,m=maxLoan();
return `<div class="kv"><span>Cash</span><b>${f(g.cash)}</b><span>Loan</span><b>${f(g.loan)}</b><span>Can borrow</span><b>${f(m)}</b></div><p class="mut">Loans cost 0.12% per day. Overdrafts cost 0.5% per day, and deep debt means bankruptcy. Borrowing multiplies your growthâ¦ and your mistakes.</p>`+btn('ln10','Borrow $10,000',m<1e4)+btn('ln50','Borrow $50,000',m<5e4)+btn('ln250','Borrow $250,000',m<25e4)+btn('rp','Repay $10,000',g.loan<1||g.cash<1e4)+btn('rpa','Repay all',g.loan<1||g.cash<g.loan)+'<button class="b" data-a="new" style="margin-top:18px">New game</button>'}
const pHTML=()=>'<div class="tabs">'+['Property','Portfolio','Bank'].map((t,i)=>`<button data-t="${i}" class="${tab==i?'on':''}">${t}</button>`).join('')+'</div><div class="pb">'+[propH,portH,bankH][tab]()+'</div>';
function ui(){if(!G)return;$('#nm').textContent=G.name;const c=$('#cash');c.textContent=fm(G.cash);c.className=G.cash<0?'bad':'';$('#nw').textContent=fm(nw());$('#day').textContent=G.day;
const I=G.idx;$('#ico').textContent=Math.round(I.co*(G.shock>0?.6:1)*100);$('#icr').textContent=Math.round(I.crop*100);$('#ipr').textContent=Math.round(I.prop*100);
if(!document.activeElement||document.activeElement.tagName!='INPUT'){const h=pHTML();if(h!==lastH){$('#panel').innerHTML=h;lastH=h}}
$('#news').innerHTML=G.log.filter(l=>Date.now()-l.t<9000).slice(0,3).map(l=>`<div class="n">${esc(l.m)}</div>`).join('')}
$('#panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!G)return;
if(b.dataset.t!=null){tab=+b.dataset.t;return ui()}
const a=b.dataset.a,g=G,p=sel?g.props[sel]:null;
if(a=='fly'){const c=PL[+b.dataset.i];MP.flyTo({center:[c[1],c[2]],zoom:16.5,pitch:60,bearing:-20});return}
if(a=='sel'){selP(b.dataset.i)}
else if(a=='new'){if(b.dataset.c){try{localStorage.removeItem('wt3')}catch(x){}saved=null;run=false;showGate(0);return}b.dataset.c=1;b.textContent='Tap again to erase everything';return}
else if(a=='buy'&&p&&p.owner===null){const c=value(p)*1.05;if(g.cash>=c){g.cash-=c;p.owner='me';say('You bought '+p.nm+'.')}}
else if(a=='sell'&&p){g.cash+=value(p)*.85;p.owner=null;p.crop=null;p.lvl=1;say('You sold '+p.nm+'.')}
else if(a=='rep'&&p){const c=p.base*.001*(100-p.cond);if(g.cash>=c){g.cash-=c;p.cond=100}}
else if(a=='up'&&p){const c=p.base*.3*p.lvl;if(g.cash>=c){g.cash-=c;p.lvl++}}
else if(a=='pl'&&p){const c=p.base*.06;if(g.cash>=c){g.cash-=c;p.crop=g.day}}
else if(a=='hv'&&p&&p.crop!=null&&g.day-p.crop>=10){g.cash+=hv(p);p.crop=null}
else if(a=='rall'){mine().forEach(q=>{const c=q.base*.001*(100-q.cond);if(g.cash>=c){g.cash-=c;q.cond=100}})}
else if(a=='ar'){g.auto.on=!g.auto.on}else if(a=='arp'){g.auto.pct=cl(Math.round(+$('#arp').value)||60,1,99)}
else if(a=='hall'){mine().forEach(q=>{if(q.crop!=null&&g.day-q.crop>=10){g.cash+=hv(q);q.crop=null}})}
else if(a=='inq'&&p){p.inq=true;note=''}
else if(a=='ba'&&p&&typeof p.owner=='number'){const c=ask(p);if(g.cash>=c){g.bots[p.owner].cash+=c;g.cash-=c;p.owner='me';note='';say('You bought '+p.nm+' from another player.')}}
else if(a=='of'&&p&&typeof p.owner=='number'){const v=+$('#oin').value;if(!(v>0))return;if(v>g.cash)note='You donât have that much cash.';else if(v>=rsv(p)){g.bots[p.owner].cash+=v;g.cash-=v;p.owner='me';note='';say('Deal! '+p.nm+' is yours for '+f(v)+'.')}else note=v>=rsv(p)*.93?'Close â they want a little more.':'Thatâs an insult. Try again.'}
else if(a&&a.startsWith('ln')){const v=+a.slice(2)*1e3;if(v<=maxLoan()){g.loan+=v;g.cash+=v}}
else if(a=='rp'||a=='rpa'){const x=Math.min(a=='rp'?1e4:g.loan,g.loan,Math.max(0,g.cash));g.loan-=x;g.cash-=x}
save();ov();ui()});
// ---- 3D map (MapLibre + OpenFreeMap / OpenStreetMap data)
let pmp;try{pmp=new pmtiles.Protocol();maplibregl.addProtocol('pmtiles',pmp.tile)}catch(e){}
const map=MP=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:[-.1276,51.5072],zoom:16.3,pitch:60,bearing:-20,maxPitch:80});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-left');
const dark=matchMedia('(prefers-color-scheme: dark)').matches,pm={};let sp1=null;
map.on('load',()=>{
map.addSource('ofm',{type:'vector',url:'https://tiles.openfreemap.org/planet'});
map.addSource('own',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
map.addLayer({id:'land1',type:'fill',source:'ofm','source-layer':'landcover',filter:['==',['get','class'],'farmland'],paint:{'fill-color':'#9fd08a','fill-opacity':.25}});
map.addLayer({id:'land2',type:'fill',source:'ofm','source-layer':'landuse',filter:['in',['get','class'],['literal',['farmland','farm']]],paint:{'fill-color':'#9fd08a','fill-opacity':.25}});
map.addLayer({id:'own3d',type:'fill-extrusion',source:'own',paint:{'fill-extrusion-color':['get','c'],'fill-extrusion-height':['get','h'],'fill-extrusion-base':['get','b'],'fill-extrusion-opacity':.95}});
ov();addB();});
// Buildings: Overture Maps footprints (OpenStreetMap + Microsoft + Google + Esri, ~2.5 billion buildings); falls back to OpenStreetMap-only tiles
const OV='https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com/tiles/2026-10-21.0/buildings.pmtiles';
let fb=0;
const HX=['case',['has','height'],['to-number',['get','height'],6],['has','num_floors'],['*',['to-number',['get','num_floors'],2],3],['has','render_height'],['to-number',['get','render_height'],6],6];
function lay(src,sl){map.addLayer({id:'b3d',type:'fill-extrusion',source:src,'source-layer':sl,minzoom:14,paint:{'fill-extrusion-color':dark?'#3a4856':'#e4dfd6','fill-extrusion-height':HX,'fill-extrusion-base':['to-number',['coalesce',['get','min_height'],['get','render_min_height']],0],'fill-extrusion-opacity':.92}},'own3d')}
async function addB(){try{const pt=new pmtiles.PMTiles(OV),ids=((await pt.getMetadata()).vector_layers||[]).map(l=>l.id),sl=ids.includes('building')?'building':ids.find(i=>!/part/.test(i));if(!sl)throw 0;
pmp.add(pt);map.addSource('ov',{type:'vector',url:'pmtiles://'+OV});lay('ov',sl)}catch(e){fb=1;lay('ofm','building')}}
map.on('error',e=>{if(!fb&&e.sourceId=='ov'){fb=1;try{map.removeLayer('b3d');map.removeSource('ov')}catch(x){}lay('ofm','building')}});
function ov(){if(!G||!map.getSource('own'))return;map.getSource('own').setData({type:'FeatureCollection',features:Object.values(G.props).filter(p=>p.owner!==null).map(p=>({type:'Feature',geometry:p.geo,properties:{k:p.key,c:p.owner==='me'?'#e8590c':'#7048e8',h:(p.ty=='farm'?.6:p.h)+.4,b:p.ty=='farm'?0:p.b}}))});
const my=mine(),ks=new Set(my.map(p=>p.key));for(const k in pm)if(!ks.has(k)){pm[k].remove();delete pm[k]}
my.forEach(p=>{if(!pm[p.key])pm[p.key]=new maplibregl.Marker({color:'#e8590c',scale:.7}).setLngLat([p.lon,p.lat]).addTo(map)})}
let gt=0;
function selP(k){sel=k;note='';tab=0;const p=G.props[k];if(sp1)sp1.remove();sp1=new maplibregl.Marker({color:'#1c2833'}).setLngLat([p.lon,p.lat]).addTo(map);
if(map.getZoom()<16.5)map.easeTo({center:[p.lon,p.lat],zoom:17,pitch:60});
if(!p.loc){clearTimeout(gt);gt=setTimeout(()=>{fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat='+p.lat+'&lon='+p.lon).then(r=>r.json()).then(j=>{const a=j.address||{};p.loc=a.suburb||a.city||a.town||a.village||a.county||'';const st=((a.house_number?a.house_number+' ':'')+(a.road||'')).trim()||j.name;if(st)p.nm=st;if(!p.loc)p.loc='â';ui()}).catch(()=>{})},400)}ui()}
map.on('click',e=>{if(!G||!run)return;let p=null;
const o=map.queryRenderedFeatures(e.point,{layers:['own3d']})[0];
if(o)p=G.props[o.properties.k];
else{const b=map.queryRenderedFeatures(e.point,{layers:['b3d']})[0];
if(b)p=mkB(b);else if(map.getLayer('land1')&&map.queryRenderedFeatures(e.point,{layers:['land1','land2']}).length)p=mkF(e.lngLat)}
if(p)selP(p.key)});
map.on('idle',()=>{if(true||!G||!run||map.getZoom()<15||Object.keys(G.props).length>8000)return;let ch=0;
map.queryRenderedFeatures({layers:['b3d']}).forEach(f=>{const k=keyOf(f);if(!G.props[k]&&H(k)<.2){mkB(f);ch++}});if(ch)ov()});
map.on('zoom',()=>{$('#zh').style.display=map.getZoom()<14?'block':'none'});
$('#q').addEventListener('keydown',e=>{if(e.key!='Enter')return;fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(e.target.value)).then(r=>r.json()).then(j=>{if(j[0])map.flyTo({center:[+j[0].lon,+j[0].lat],zoom:16.5,pitch:60})}).catch(()=>{})});
// ---- gate & loop
function showGate(over){$('#gate').style.display='flex';
$('#gate .box').innerHTML=over?`<h2>Bankrupt!</h2><p>Your debts outgrew your empire. Every great tycoon fails once â borrow less, repair more, and watch the market.</p><button id="go">Start a new empire</button>`:`<h2>Worldwide Tycoon 3D</h2><p>Every real building and farm field on Earth is for sale â houses included. Start poor, scale up, and donât let it all fall apart.</p><input id="nin" maxlength="16" placeholder="Choose your player name" value="${saved?esc(saved.name):''}"><button id="go">${saved?'Continue':'Start playing'}</button>`}
$('#gate').addEventListener('click',e=>{if(e.target.id!='go')return;const n=$('#nin'),name=(n?n.value.trim():'')||'Player';
G=saved&&n&&name===saved.name?saved:newG(name);Object.values(G.props).forEach(p=>{if(typeof p.owner=='number')p.owner=null});G.auto=G.auto||{on:false,pct:60};$('#gate').style.display='none';run=true;sel=null;tab=0;lastH='';
if(sp1){sp1.remove();sp1=null}for(const k in pm){pm[k].remove();delete pm[k]}
map.flyTo({center:[-.1276,51.5072],zoom:16.3,pitch:60,bearing:-20});
if(G.day==1)say('Welcome, '+name+'! You start with $25,000. Zoom in and tap a building.');ov();ui()});
$('#spd').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sp=+b.dataset.s;document.querySelectorAll('#spd button').forEach(x=>x.classList.toggle('on',x==b))});
setInterval(()=>{if(!G||!run||!sp)return;for(let i=0;i<sp&&run;i++)tick();ui()},1000);
showGate(0);
