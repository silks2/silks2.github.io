</style></head><body><div class="w" id="app"></div>
<script>
const FN=["Travis","Michael","Harry","Harry","Harry","Aadhav","Tyler","Felix","Shubminder","Hugh","Freddy","Freddie","Tyler","Dexter","Finley","Michael","Billy","Harry","Jack","Aryan","Rafe","Ryder","Yaqoob","Alfie","Alfie","Kayden","Evan","Rudy","George","Bill","Riley","Aadhesh"];
const LN=["Parkins","Culloty","Cunningham","Baker","Little","Rajkumar","Dawson","Mars","Rathod","Brown","Grover","Clements","Cockbill","Walton","MacAlonan","Simeon","Williams","Munson","Litte","Allom","Dowling","Venman","Ibn-Anwar","Wolfe","Pithman","Mansell","Dolman","Perry-Kite","Beverley","Goldsmith","White","Ilyraja"];
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[RI(0,a.length-1)],clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)};
const ST=['sho','ins','pla','reb','def','ath'],LBL={sho:'Shooting',ins:'Inside',pla:'Playmaking',reb:'Rebounding',def:'Defense',ath:'Athleticism'};
const POS=['PG','SG','SF','PF','C'];
const W={PG:[.2,.1,.3,.05,.15,.2],SG:[.3,.15,.15,.05,.15,.2],SF:[.2,.2,.1,.1,.2,.2],PF:[.1,.25,.05,.25,.2,.15],C:[.05,.25,.05,.3,.25,.1]};
const BIAS={PG:[3,-4,8,-8,0,2],SG:[8,0,0,-6,-2,2],SF:[2,2,0,0,2,3],PF:[-4,6,-4,6,3,0],C:[-8,8,-6,10,4,-2]};
const STY={'Sharpshooters':{sho:7,ins:-4},'Bruisers':{ins:6,reb:6,sho:-5},'Lockdown D':{def:8,pla:-3},'Run & Gun':{ath:7,pla:3,def:-5},'Balanced':{}};
const NAMES=['Eastwood United','Wilson Wanderers','Northgate DT','Eastfield Cats','Mathsblock Meddlers','The Otimpings','English Pearls','Mrs Ballers','Piercy Playmakers','Capital Royals','Metro Giants','Citadel Knights','Ironbridge Falcons','Summit Stags','Royal Oak Rams','Marlowe Panthers','Stonegate Bulls','Kingsway Jets','Beacon Phoenix'];
let ME=''Weststone Academy',ren=false;const NMD=18;
let G,uid=1;
const ovr=(p,s=p.s)=>Math.round(ST.reduce((a,k,i)=>a+s[k]*W[p.pos][i],0));
function pickName(list,key){const u=(G.nu=G.nu||{}),w=list.map(n=>1/Math.pow(3,u[key+n]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;for(;i<list.length-1&&(r-=w[i])>0;i++);u[key+list[i]]=(u[key+list[i]]||0)+1;return list[i]}
function mk0(age,lvl,youth){const pos=pick(POS),B=BIAS[pos],s={},c={},n={};
 const g=youth?R(4,32)+(Math.random()<.12?R(6,12):0):R(0,3);
 ST.forEach((k,i)=>{s[k]=clamp(lvl+B[i]+gauss()*5,22,92);c[k]=youth?clamp(s[k]+Math.max(0,g+gauss()*6),s[k],99):s[k]+R(0,2);n[k]=R(-1,1)});
 return ens({id:uid++,f:CPU?pickName(FN2,'g'):pickName(FN,'f'),l:CPU?pickName(LN2,'h'):pickName(LN,'l'),age,pos,s,c,n,np:R(-1,1),wk:0})}
const sp=p=>Math.max(2,10-p.wk*.35*10/NMD);
const rng=(v,n,d)=>{const m=v+n*d*.35;return[Math.round(clamp(m-d,1,99)),Math.round(clamp(m+d,1,99))]};
const PH={sho:'a pure shooter with a sweet stroke',ins:'a bruising finisher around the rim',pla:'a natural passer with great court vision',reb:'a relentless rebounder',def:'a lockdown defender in the making',ath:'an explosive athlete with huge physical tools'};
const WK={sho:'shot mechanics need heavy work',ins:'struggles to finish through contact',pla:'loose with the ball and limited vision',reb:'poor positioning on the glass',def:'a liability on defense',ath:'lacks athletic tools'};
function desc(p){const m=avg(ST.map(k=>p.c[k])),d=ST.map(k=>[k,p.c[k]-m-BIAS[p.pos][ST.indexOf(k)]*.5]).sort((a,b)=>b[1]-a[1]);
 const pm=ovr(p,p.c),t=pm>=80?'Could become a franchise player.':pm>=72?'Looks a future starter.':pm>=64?'Should become a solid rotation piece.':'Likely a depth player.';
 return`Might become ${PH[d[0][0]]}, with ${PH[d[1][0]].replace(/^an? /,'')} to back it up. Concern: ${WK[d[5][0]]}. ${t}`}
function develop(p,m=1){const r=m*10/NMD*(p.age<=19?.05:p.age<=21?.035:p.age<=24?.015:0);if(r)ST.forEach(k=>{if(p.s[k]<p.c[k])p.s[k]+=(p.c[k]-p.s[k])*r*R(.5,1.5)})}
const byId=id=>G.senior.find(p=>p.id==id);
function ensureXI(){G.xi=G.xi.filter(id=>byId(id));const rest=[...G.senior].filter(p=>!G.xi.includes(p.id)).sort((a,b)=>ovr(b)-ovr(a));while(G.xi.length<5)G.xi.push(rest.shift().id);G.xi=G.xi.slice(0,5)}
function autoXI(){G.xi=[...G.senior].sort((a,b)=>ovr(b)-ovr(a)).slice(0,5).sort((a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos)).map(p=>p.id)}
function myStats(){ensureXI();const st=G.xi.map(byId),bn=G.senior.filter(p=>!G.xi.includes(p.id)).sort((a,b)=>ovr(b)-ovr(a)).slice(0,3),t={};
 ST.forEach(k=>{const a=avg(st.map(p=>p.s[k]));t[k]=bn.length?.82*a+.18*avg(bn.map(p=>p.s[k])):a});return t}
const tStats=n=>n==ME?myStats():G.ai.find(t=>t.name==n).s;
const tOvr=n=>Math.round(avg(ST.map(k=>tStats(n)[k])));
const off=s=>.3*s.sho+.25*s.ins+.25*s.pla+.2*s.ath,def=s=>.45*s.def+.2*s.reb+.2*s.ath+.15*s.pla;
function genAI(){const tiers=[73,70,68,65,63,60,58,55,53].sort(()=>Math.random()-.5),sk=Object.keys(STY);
 G.ai=NAMES.map((name,i)=>{const style=pick(sk),s={};ST.forEach(k=>s[k]=tiers[i]+(STY[style][k]||0)+gauss()*2);return{name,style,s,off:POS.map(()=>gauss()*3)}})}
function mkSched(){const T=[ME,...NAMES],n=T.length,r=[];let a=[...T];
 for(let i=0;i<n-1;i++){const m=[];for(let j=0;j<n/2;j++)m.push([a[j],a[n-1-j]]);r.push(m);a=[a[0],a[n-1],...a.slice(1,n-1)]}
 G.sched=[...r,...r.map(m=>m.map(([h,x])=>[x,h]))]}
const blankTable=()=>{G.table={};[ME,...NAMES].forEach(n=>G.table[n]={w:0,l:0,pf:0,pa:0})};
function newGame(){uid=1;G={me:ME,nu:{},cash:1500,lg:1,start:'2026-10-20',offers:[],mkt:[],season:1,md:0,senior:[],academy:[],xi:[],results:[],log:[],msg:'Welcome! Your academy is your future — scout, develop and promote wisely.'};
 for(let i=0;i<9;i++)G.senior.push(mk(RI(19,27),R(55,66),false));
 for(let i=0;i<6;i++)G.academy.push(mk(RI(15,18),R(36,52),true));
 autoXI();genAI();mkSched();blankTable();fillMkt();save()}
function save(){try{localStorage.setItem('hoopsacad',JSON.stringify({G,uid},(k,v)=>k=='p'?undefined:v))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('hoopsacad'));if(d&&d.G){G=d.G;uid=d.uid;ME=G.me||ME;[...G.senior,...G.academy].forEach(ens);if(G.ai.length!=NAMES.length||!G.ai[0].sen){G.lg=1;G.start='2026-10-20';genAI();G.mkt=[];mkSched();blankTable();G.md=0;G.results=[];G.msg='Every club now has a full squad and youth academy, so a fresh season begins!'}if(!G.cal){G.start=G.start||'2026-10-20';G.md=0;G.results=[];blankTable();mkSched();G.msg='A calendar and a knockout cup have been added! A fresh season begins.'}if(G.cash==null)G.cash=1500;if(G.scout){G.cash+=G.scout;G.scout=0;G.msg='Scout investments were refunded. You now have a star-rated chief scout instead.'}G.ai.forEach(t=>[...t.sen,...t.aca].forEach(p=>{if(!p.cpu){p.f=pickName(FN2,'g');p.l=pickName(LN2,'h');p.cpu=1}}));G.offers=G.offers||[];G.mkt=G.mkt||[];G.mkt.forEach(l=>{const t=G.ai.find(x=>x.name==l.team);l.p=t&&(l.sen?t.sen:t.aca).find(p=>p.id==l.id)});G.mkt=G.mkt.filter(l=>l.p);fillMkt();if(G.ai.length!=NAMES.length){genAI();mkSched();blankTable();G.md=0;G.results=[];G.msg='The league has expanded to 10 teams! A fresh season begins.'}return true}}catch(e){}return false}
function game(A,B,homeA){const f=(X,Y,h)=>98+.9*(off(X)-def(Y))+.15*(X.reb-Y.reb)+(h?2:0)+gauss()*7;
 let a=Math.round(f(A,B,homeA)),b=Math.round(f(B,A,!homeA)),ot=false;if(a==b){ot=true;if(Math.random()<.5)a+=RI(2,8);else b+=RI(2,8)}return[a,b,ot]}
function playMD(){if(G.md>=NMD)return;ensureXI();const before=Object.fromEntries(G.academy.map(p=>[p.id,ovr(p)]));let note='';
 G.sched[G.md].forEach(([h,a])=>{const[hs,as,ot]=game(tStats(h),tStats(a),true);
  G.table[h].pf+=hs;G.table[h].pa+=as;G.table[a].pf+=as;G.table[a].pa+=hs;(hs>as?G.table[h]:G.table[a]).w++;(hs>as?G.table[a]:G.table[h]).l++;
  G.results.push({md:G.md+1,h,a,hs,as,ot});
  if(h==ME||a==ME){const mine=h==ME?hs:as,opp=h==ME?as:hs,o=h==ME?a:h,w=mine>opp,st=G.xi.map(byId),wt=st.map(p=>(p.s.sho+p.s.ins+p.s.pla*.3)*R(.6,1.4)),tot=wt.reduce((x,y)=>x+y,0);
   const pts=wt.map(x=>Math.round(x/tot*mine*.85)),i=pts.indexOf(Math.max(...pts)),ts=tStats(ME),os=tStats(o);
   const why=ts.reb-os.reb>4?'Dominated the glass.':os.reb-ts.reb>4?'Out-rebounded all night.':def(ts)>def(os)+4?'Defense carried the day.':off(ts)>off(os)+4?'Offense was too hot to handle.':'A tight, even contest.';
   note=`${w?'WIN':'LOSS'} ${mine}–${opp} ${h==ME?'vs':'at'} ${o}${ot?' (OT)':''}. ${st[i].f} ${st[i].l} top-scored with ${pts[i]}. ${why}`}});
 G.md++;if(G.md==NMD/2){const k=RI(1,2);let c=0;for(let i=0;i<k&&G.academy.length<10;i++){const y=mk(RI(15,17),R(36,52),true);y.new=1;G.academy.push(y);c++}if(c)note+=` Mid-season intake: ${c} new youth${c>1?'s':''} joined the academy.`}
 [...G.academy].forEach(p=>{develop(p);p.wk++;if(ovr(p)-before[p.id]>=.55)G.log.unshift(`${p.f} ${p.l} (academy) is improving fast.`)});
 G.senior.forEach(p=>develop(p,G.xi.includes(p.id)?1.3:0));G.log=G.log.slice(0,6);G.msg=note+(mktTick()?' New transfer offer for one of your academy players! Check the Market tab.':'');save();render()}
function rollover(){const rows=standings(),champ=rows[0][0],rk=rows.findIndex(r=>r[0]==ME)+1,bud=rk<=6?400+(10-rk)*120+(rk==1?300:0):rk<=8?0:rk==9?-300:-500;
 G.senior.forEach(p=>{p.age++;if(p.age>=31)ST.forEach(k=>p.s[k]-=RI(0,3))});
 const ret=G.senior.filter(p=>p.age>=35&&G.senior.length>5);G.senior=G.senior.filter(p=>!ret.includes(p)||G.senior.length<=5);
 G.academy.forEach(p=>{p.age++;p.new=0});const gone=G.academy.filter(p=>p.age>=20);G.academy=G.academy.filter(p=>p.age<20);
 for(let k=RI(3,4);k>0&&G.academy.length<acCap();k--){const y=mk(RI(15,17),R(36,52),true);y.new=1;G.academy.push(y)}
 G.ai.forEach(aiSeason);
 G.cash+=bud;if(G.cash<0){const c=-G.cash,gm=`GAME OVER! In Season ${G.season} you finished ${rk}th and the club fell ${money(c)} into debt. The board has sacked you, so a brand new game has started.`;newGame();tab='academy';G.msg=gm;render();return}fillMkt(true);promoRel();G.offers=[];G.season++;G.md=0;G.start=addD(G.start,364);G.results=[];mkSched();blankTable();ensureXI();
 G.msg=`${champ} won Season ${G.season-1}. ${gone.length?gone.map(p=>p.f+' '+p.l).join(', ')+' left the academy (too old). ':''}${ret.length?ret.map(p=>p.f+' '+p.l).join(', ')+' retired. ':''}A new intake of youngsters has arrived. Budget ${bud>0?'boost: +':bud<0?'penalty: -':'change: '}${money(Math.abs(bud))} for finishing ${rk}${['th','st','nd','rd'][rk<4?rk:0]}. ${G.promo}`;save();render()}
function doRen(){const e=document.getElementById('tn'),n=(e?e.value:'').replace(/[<>"&]/g,'').trim().slice(0,24);ren=false;
 if(!n||n==ME){return render()}
 if(NAMES.includes(n)){G.msg='That name belongs to another club.';return render()}
 const o=ME;G.table[n]=G.table[o];delete G.table[o];G.sched.forEach(m=>m.forEach(f=>f.forEach((x,i)=>{if(x==o)f[i]=n})));G.results.forEach(r=>{if(r.h==o)r.h=n;if(r.a==o)r.a=n});ME=n;G.me=n;G.msg=`Club renamed to ${n}.`;save();render()}
function standings(){return Object.entries(G.table).sort((a,b)=>b[1].w-a[1].w||(b[1].pf-b[1].pa)-(a[1].pf-a[1].pa))}
function promote(id){if(G.senior.length>=13){G.msg='First team is full (13). Release someone first.';return render()}
 const i=G.academy.findIndex(p=>p.id==id),p=G.academy.splice(i,1)[0];p.o0=ovr(p);G.senior.push(p);G.msg=`${p.f} ${p.l} promoted! True ratings revealed: OVR ${ovr(p)}.`;save();render()}
function rel(id,from){const l=G[from];if(from=='senior'&&l.length<=5){G.msg='You need at least 5 senior players.';return render()}
 const i=l.findIndex(p=>p.id==id),p=l.splice(i,1)[0];G.msg=`${p.f} ${p.l} released.`;if(from=='senior')ensureXI();save();render()}
function tog(id){if(G.xi.includes(id))G.xi=G.xi.filter(x=>x!=id);else{if(G.xi.length>=5)G.xi.shift();G.xi.push(id)}if(G.xi.length<5)ensureXI();save();render()}
