<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D&amp;D Campaign Maker</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#f4eee0;--pn:#fffaf0;--ink:#2b2118;--ac:#8b2e1f;--ln:#d9ccb4;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1612;--pn:#252019;--ink:#f1e6d2;--ac:#e0705a;--ln:#463b2e;--ac2:#1a1612;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1612;--pn:#252019;--ink:#f1e6d2;--ac:#e0705a;--ln:#463b2e;--ac2:#1a1612;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;overflow:hidden}
button,input,.fb{font:inherit;color:var(--ink)}
button,.fb{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-block}
button:hover,.fb:hover{border-color:var(--ac)}
button.pr{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:bold}
input[type=text],input[type=password]{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box}
#home{margin:auto;max-width:380px;width:calc(100% - 32px);text-align:center;overflow:auto;max-height:100%}
#home h1{font-size:2.4em;margin:.2em 0;color:var(--ac);letter-spacing:.02em}
#home .card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px;margin:14px 0;display:grid;gap:10px}
#home p{margin:0;opacity:.8}
#st{color:var(--ac);min-height:1.4em;text-align:center;font-size:.9em}
#app{display:none;flex:1;min-height:0;flex-direction:column}
#top{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--ln);background:var(--pn);flex-wrap:wrap}
#top b{color:var(--ac)} .code{font-family:monospace;font-size:1.3em;letter-spacing:.18em;background:var(--bg);border:1px dashed var(--ac);border-radius:8px;padding:2px 10px}
#main{flex:1;min-height:0;display:flex}
#side{width:250px;flex:none;overflow:auto;padding:10px;border-right:1px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;gap:8px}
#side h3{margin:6px 0 0;font-size:1em;color:var(--ac)}
#side button,#side .fb{width:100%;box-sizing:border-box;text-align:left}
.sc.on{border-color:var(--ac);background:var(--bg)} .lv{color:var(--ac);float:right}
#lib{display:flex;flex-wrap:wrap;gap:6px} #lib img{width:52px;height:52px;object-fit:contain;border:1px solid var(--ln);border-radius:6px;background:var(--bg);cursor:grab}
#tools{display:none;gap:4px;flex-wrap:wrap} #tools button{width:auto!important;padding:5px 9px}
.hint{font-size:.8em;opacity:.7;margin:0}
#view{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#0006;position:relative;overflow:hidden}
#stage{position:relative;overflow:hidden;background:linear-gradient(135deg,#3a3329,#6b5b45);box-shadow:0 4px 24px #0008;flex:none}
.it{position:absolute;transform-origin:center;user-select:none;-webkit-user-drag:none;touch-action:none;pointer-events:none}
.host .it{pointer-events:auto;cursor:grab} .it.sel{outline:2px dashed #ffd24a;outline-offset:2px}
.msg{color:#fff;opacity:.8;padding:20px;text-align:center}
#bar{border-top:1px solid var(--ln);background:var(--pn);padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:28px}
#dice{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#bar.hide #dice{display:none}
#dice button{min-width:48px;font-weight:bold}
#res{font-size:1.2em;min-width:110px;text-align:center}#res.pop{animation:pop .4s}
@keyframes pop{from{transform:scale(1.6);color:var(--ac)}to{transform:none}}
.chip{background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:2px 10px;white-space:nowrap}
@media (max-width:700px){#main{flex-direction:column}#side{width:auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--ln)}}
#tm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;z-index:20;width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center}
#top{padding-right:48px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;border:1px solid #0005}
.chip.new{animation:pop .5s}
#bar{--dc:#b3261e;--dt:#fff}
#dice button[data-d]{background:var(--dc);color:var(--dt);border-color:var(--dc)}
#sw{display:flex;gap:4px;margin-left:6px;padding-left:8px;border-left:1px solid var(--ln)}
.swb{width:20px;height:20px;min-width:0!important;padding:0!important;border-radius:50%;border:2px solid var(--ln)!important}
.swb.on{border-color:var(--ink)!important;transform:scale(1.2)}
#res{display:flex;align-items:center;text-align:left}
#die{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--dc);color:var(--dt);font-size:1.25em;margin-right:8px;box-shadow:0 2px 6px #0004}
#die.roll{animation:tumble .55s linear infinite}
#die.land{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
#die.crit{box-shadow:0 0 18px 5px #ffd24a}
#die.fail{animation:shake .45s}
@keyframes tumble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(110deg) scale(1.18)}50%{transform:rotate(230deg) scale(.92)}75%{transform:rotate(320deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
@keyframes land{from{transform:scale(1.8) rotate(-25deg)}to{transform:none}}
@keyframes shake{20%{transform:translateX(-6px) rotate(-8deg)}40%{transform:translateX(6px) rotate(8deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#cm{position:fixed;inset:0;z-index:50;background:#000a;display:grid;place-items:center}
#cm .cb{background:var(--pn);padding:12px;border-radius:12px;max-width:94vw;max-height:94vh;overflow:auto;text-align:center}
#cw{position:relative;display:inline-block;line-height:0;overflow:hidden;touch-action:none}
#ci{max-width:86vw;max-height:64vh;display:block;user-select:none;-webkit-user-drag:none}
#cx{position:absolute;border:2px solid #ffd24a;box-shadow:0 0 0 9999px #0008;cursor:move;box-sizing:border-box;touch-action:none}
#cx i{position:absolute;width:20px;height:20px;background:#ffd24a;opacity:.9}
#cx i[data-h=tl]{left:0;top:0;cursor:nwse-resize}#cx i[data-h=tr]{right:0;top:0;cursor:nesw-resize}
#cx i[data-h=bl]{left:0;bottom:0;cursor:nesw-resize}#cx i[data-h=br]{right:0;bottom:0;cursor:nwse-resize}
#cm .cr{display:flex;gap:8px;justify-content:center;margin-top:10px}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;text-align:center;font-size:12px;white-space:nowrap;z-index:5}
.tag b{display:inline-block;background:#000b;color:#fff;border-radius:6px;padding:1px 8px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.hb{position:relative;width:78px;height:11px;background:#000a;border:1px solid #fff8;border-radius:6px;margin:2px auto 3px;overflow:hidden}
.hb i{display:block;height:100%;transition:width .3s}
.hb span{position:absolute;inset:0;font-size:9px;line-height:11px;color:#fff;text-shadow:0 0 2px #000}
.hb.big{width:100%;height:18px;border-color:var(--ln);background:var(--bg)}.hb.big span{font-size:12px;line-height:18px;color:var(--ink);text-shadow:none}
#asg{border-top:1px solid var(--ln);padding-top:6px;display:none}
#asg select,#asg input[type=number]{background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:6px;width:100%;box-sizing:border-box}
#asg .row{display:flex;gap:6px;margin-top:6px;align-items:center}#asg .row button{width:auto!important;white-space:nowrap}
#ov{position:fixed;inset:0;z-index:60;background:#000b;display:grid;place-items:center}
#ov .cb{background:var(--pn);padding:18px 22px;border-radius:12px;max-width:90vw;text-align:center}
.pr2{display:flex;gap:4px;align-items:center}.pr2 .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr2 button{width:auto!important;padding:2px 7px!important}.dot.off{background:transparent!important}
.tag.me b{background:#8b2e1f}
</style></head><body>
<button id="tm" title="Toggle dark / light mode" aria-label="Toggle dark or light mode"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
<div id="home">
  <h1>🎲 Thing Innit</h1>
  <p>A simple online D&amp;D campaign maker</p>
  <div class="card">
    <input type="text" id="nm" maxlength="20" placeholder="Choose a username" autocomplete="off">
    <button class="pr" id="cr">Create campaign</button>
    <button id="rs" style="display:none">Resume my last campaign</button>
    <label class="fb">Import campaign file<input type="file" accept=".json,application/json" id="im" hidden></label>
  </div>
  <div class="card">
    <input type="text" id="cd" maxlength="5" placeholder="Lobby code" autocomplete="off" style="text-transform:uppercase;text-align:center;letter-spacing:.2em">
    <input type="password" id="pw" placeholder="Passphrase (optional sign-in)" autocomplete="off">
    <label class="hint" style="display:flex;gap:6px;align-items:center;justify-content:center"><input type="checkbox" id="rm" checked> Remember me on this device</label>
    <button id="jn">Join lobby</button>
    <button id="rj" style="display:none">Rejoin last lobby</button>
    <button id="fg" style="display:none">Sign out / forget saved sign-in</button>
    <p class="hint">Optional: choose a passphrase to claim your username in a lobby. Sign in with the same name and passphrase on any device to get your character back. Don’t reuse a real password.</p>
  </div>
  <div id="st">Ready.</div>
</div>
<div id="app">
  <div id="top"></div>
  <div id="main"></div>
  <div id="bar"></div>
</div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",PREF="realmtable-dnd-";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
let peer=null,conn=null,conns=[],players={},me="",code="",host=false,camp={live:null,scenes:[],sizes:{},last:.15},imgs={},asp={},edit=null,sel=null,drag=null,SW=1,SH=1;
const COLS=["#b3261e","#e07a1f","#d4a017","#2e7d32","#00838f","#1e5fbf","#7b3fa0","#d6457f","#2b2b2b","#f2efe6"],okc=c=>/^#[0-9a-f]{6}$/i.test(c)?c:"#b3261e",
  ink=c=>{const n=parseInt(okc(c).slice(1),16);return((n>>16&255)*299+(n>>8&255)*587+(n&255)*114)/1000>150?"#111":"#fff"};
let myCol="#b3261e",seen={},lastR=null,rolling=false;try{myCol=okc(localStorage.getItem("dnd_col")||myCol)}catch(e){}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("dnd_theme",t)}catch(e){}}
{let t=null;try{t=localStorage.getItem("dnd_theme")}catch(e){}setTheme(t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))}
$("#tm").onclick=()=>setTheme(document.documentElement.dataset.theme=="dark"?"light":"dark");
const chip=(q,fresh,you)=>`<span class="chip${fresh?" new":""}"><i class="dot" style="background:${okc(q.c)}"></i><b>${esc(q.n)}</b>${q.a?" 🔒":""}${q.h?" 👑":""}${you?" (you)":""} ${q.d?esc(q.d)+" → <b>"+(+q.v||0)+"</b>":(q.h?"":"—")}</span>`;
function setCol(c){myCol=okc(c);const b=$("#bar");if(!b)return;b.style.setProperty("--dc",myCol);b.style.setProperty("--dt",ink(myCol));
  b.querySelectorAll(".swb").forEach(x=>x.classList.toggle("on",x.dataset.c==myCol));try{localStorage.setItem("dnd_col",myCol)}catch(e){}if(conn&&conn.open)conn.send({t:"col",c:myCol})}
function roll(n){if(rolling)return;rolling=true;const die=$("#die"),rt=$("#rt"),v=1+Math.floor(Math.random()*n);die.className="roll";rt.textContent="Rolling d"+n+"…";
  const iv=setInterval(()=>{die.textContent=1+Math.floor(Math.random()*n)},70);
  setTimeout(()=>{clearInterval(iv);die.textContent=v;die.className=n==20&&v==20?"land crit":n==20&&v==1?"fail":"land";rt.textContent=`d${n} → ${v}`;rolling=false;
    if(conn&&conn.open)conn.send({t:"roll",d:"d"+n,v})},780)}
function showRoster(r){const el=$("#pls");if(!el||!Array.isArray(r))return;
  el.innerHTML=r.slice(0,30).map(q=>{const f=q.k&&seen[q.i]!==q.k;seen[q.i]=q.k;return chip({...q,n:String(q.n||"?").slice(0,20)},f,peer&&q.i===peer.id)}).join(" ")}
const say=t=>$("#st").textContent=t,say2=t=>{const c=$("#cnt");if(c){c.textContent=t;setTimeout(()=>{c.textContent=""},4000)}};
const kv=(m,k,v)=>new Promise((ok,no)=>{const r=indexedDB.open("realmtable",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");
  r.onsuccess=()=>{const s=r.result.transaction("kv",m=="g"?"readonly":"readwrite").objectStore("kv"),q=m=="g"?s.get(k):s.put(v,k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no()};r.onerror=()=>no()});
try{$("#nm").value=localStorage.getItem("dnd_name")||""}catch(e){}
kv("g","host").then(h=>{if(h)$("#rs").style.display=""}).catch(()=>{});
function nameOk(){me=$("#nm").value.trim().slice(0,20);if(!me){say("Pick a username first.");return false}
  if(typeof Peer=="undefined"){say("Could not load the connection library – check your internet connection.");return false}
  try{localStorage.setItem("dnd_name",me)}catch(e){}return true}
function shrink(f,max,type,lim,crop){return new Promise((ok,no)=>{const own=typeof f!="string",u=own?URL.createObjectURL(f):f,im=new Image();
  im.onload=()=>{const sx=crop?crop.x*im.width:0,sy=crop?crop.y*im.height:0,sw=crop?crop.w*im.width:im.width,sh=crop?crop.h*im.height:im.height;let m=max,q=.78,out;
    for(let i=0;i<9;i++){const k=Math.min(1,m/Math.max(sw,sh)),c=document.createElement("canvas");c.width=Math.max(1,sw*k|0);c.height=Math.max(1,sh*k|0);
      c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);out=c.toDataURL(type,q);if(out.length<lim)break;m*=.8;q=Math.max(.4,q-.06)}
    if(own)URL.revokeObjectURL(u);out.length<lim*1.3?ok(out):no(new Error("big"))};im.onerror=no;im.src=u})}
function measure(id){if(asp[id]!==undefined||!imgs[id])return;const i=new Image();asp[id]=0;i.onload=()=>{asp[id]=i.width/i.height;draw()};i.src=imgs[id].data}
const mkcode=()=>Array.from({length:5},()=>AL[Math.random()*AL.length|0]).join("");
const openPeer=id=>new Promise((ok,no)=>{const p=id?new Peer(PREF+id.toLowerCase()):new Peer();p.on("open",()=>ok(p));p.on("error",no)});
async function startHost(c,keep){say("Opening lobby…");try{for(let t=0;t<9&&!peer;t++){try{peer=await openPeer(c)}catch(e){if(e.type!="unavailable-id")throw e;if(keep&&t<5)await new Promise(r=>setTimeout(r,2000));else c=mkcode()}}
    if(!peer)throw 0;code=c;host=true;peer.on("connection",onConn);peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});peer.on("error",e=>say2("Network issue: "+e.type));
    persist();enter()}catch(e){peer=null;say("Could not open a lobby. Check your connection and try again.")}}
$("#cr").onclick=()=>{if(!nameOk())return;const s={id:uid(),name:"Scene 1",bg:null,items:[]};camp={live:s.id,scenes:[s],sizes:{},last:.15,hp:{}};imgs={};edit=s.id;startHost(mkcode())};
function exportCamp(){const b=new Blob([JSON.stringify({app:"realmtable",v:1,code,camp,imgs})],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="campaign-"+code+".realm.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function parseBundle(txt){const o=JSON.parse(txt);if(!o||o.app!="realmtable"||!o.camp||!Array.isArray(o.camp.scenes)||!o.camp.scenes.length)throw 0;
  const im={};for(const[k,v]of Object.entries(o.imgs||{}))if(v&&typeof v.data=="string"&&/^data:image\//.test(v.data))im[k]={data:v.data,kind:v.kind=="bg"?"bg":"item"};
  const c=o.camp;c.scenes.forEach(s=>{s.items=Array.isArray(s.items)?s.items:[]});c.sizes=c.sizes||{};c.hp=c.hp&&typeof c.hp=="object"?c.hp:{};c.accts=c.accts&&typeof c.accts=="object"?c.accts:{};c.bans=Array.isArray(c.bans)?c.bans.filter(x=>typeof x=="string"):[];c.last=c.last||.15;if(!c.scenes.some(s=>s.id===c.live))c.live=c.scenes[0].id;
  return{code:String(o.code||"").slice(0,5),camp:c,imgs:im}}
async function readBundle(e){const f=e.target.files[0];e.target.value="";if(!f)return null;try{return parseBundle(await f.text())}catch(x){return false}}
$("#im").onchange=async e=>{const o=await readBundle(e);if(o===null)return;if(o===false){say("That file is not a valid campaign.");return}
  if(!nameOk())return;camp=o.camp;imgs=o.imgs;asp={};Object.keys(imgs).forEach(measure);edit=camp.live;startHost(o.code||mkcode(),1)};
$("#rs").onclick=async()=>{if(!nameOk())return;try{const h=await kv("g","host");camp=h.camp;camp.hp=camp.hp||{};imgs=h.imgs||{};edit=camp.live||camp.scenes[0].id;Object.keys(imgs).forEach(measure);startHost(h.code,1)}catch(e){say("Nothing to resume.")}};
const accts=()=>camp.accts||(camp.accts={}),bans=()=>camp.bans||(camp.bans=[]);
function refuse(c,why,w){try{c.send({t:"kick",why,w})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},250)}
function drop(c){delete players[c.peer];conns=conns.filter(x=>x!==c);try{c.close()}catch(e){}rolls()}
function kick(c,why){refuse(c,why);delete players[c.peer];conns=conns.filter(x=>x!==c);rolls()}
function kickName(k,why){conns.filter(c=>players[c.peer]&&players[c.peer].key==k).forEach(c=>kick(c,why))}
function onConn(c){c.sent=new Set();c.seen=Date.now();conns.push(c);
  c.on("data",m=>{if(!m||typeof m!="object")return;c.seen=Date.now();const q=players[c.peer];
    if(m.t=="hi"&&!q){const n=String(m.n||"Player").trim().slice(0,20)||"Player",key=n.toLowerCase(),k=typeof m.k=="string"&&m.k.length>0&&m.k.length<=100?m.k:null,ac=accts()[key],
        other=conns.find(x=>x!==c&&players[x.peer]&&players[x.peer].key==key);
      if(key==me.toLowerCase())return refuse(c,"That name belongs to the host.");
      if(bans().includes(key))return refuse(c,"You were banned from this lobby.");
      if(ac&&ac.h!==k)return refuse(c,k?"Wrong passphrase for that name.":"That name is claimed – enter the passphrase you signed up with.",k?1:0);
      if(other){if(ac||m.r)kick(other,"You signed in from another device.");else return refuse(c,"That name is already in the lobby.")}
      if(!ac&&k){accts()[key]={h:k,n};persist()}
      players[c.peer]={n,key,a:!!k,c:okc(m.c)};c.send({t:"ok",a:!!k});pushTo(c)}
    else if(!q)return;
    else if(m.t=="col")q.c=okc(m.c);
    else if(m.t=="roll"){q.d=String(m.d).slice(0,5);q.v=+m.v||0;q.k=(q.k||0)+1}
    else if(m.t=="bye")return drop(c);
    rolls()});
  c.on("close",()=>{delete players[c.peer];conns=conns.filter(x=>x!==c);rolls()});c.on("error",()=>{})}
function plist(){const el=$("#pl");if(!el)return;const on={};Object.values(players).forEach(q=>on[q.key]=q);
  const keys=[...new Set([...Object.keys(on),...Object.keys(accts()),...bans()])];el.innerHTML=keys.length?"":'<p class="hint">Nobody has joined yet.</p>';
  keys.forEach(k=>{const q=on[k],ban=bans().includes(k),a=accts()[k],row=document.createElement("div");row.className="pr2";
    row.innerHTML=`<span class="nm"><i class="dot${q?"":" off"}" style="${q?"background:"+okc(q.c):""}"></i>${esc(q?q.n:(a&&a.n)||k)}${a?" 🔒":""}${ban?" (banned)":q?"":" (offline)"}</span>`;
    const add=(t,title,fn)=>{const b=document.createElement("button");b.textContent=t;b.title=title;b.onclick=fn;row.appendChild(b)};
    if(q&&!ban)add("⏏","Kick from the lobby",()=>kickName(k,"You were removed from the lobby by the host."));
    add(ban?"Unban":"🚫",ban?"Unban":"Ban this name from the lobby",()=>{if(ban)bans().splice(bans().indexOf(k),1);else{bans().push(k);kickName(k,"You were banned from this lobby.")}persist();plist()});
    if(a)add("🔓","Release this name (lets the player sign up again with a new passphrase)",()=>{delete accts()[k];persist();plist()});
